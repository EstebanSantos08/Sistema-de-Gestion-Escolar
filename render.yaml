databases:
  - name: school-system-db
    plan: free

services:
  - type: web
    name: school-system-backend
    env: node
    plan: free
    rootDir: back-end
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: school-system-db
          property: connectionString